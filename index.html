<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mario Game - Mobile Friendly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #5c94fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Touch controls — hidden by default so they never block menus on Mac/desktop */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 1000;
        }

        .controls.controls--visible {
            display: flex;
        }

        /* Never show touch pads on fine-pointer devices (Mac trackpad/mouse) */
        @media (pointer: fine) {
            .controls.controls--visible {
                display: none !important;
            }
        }

        .left-controls,
        .right-controls {
            pointer-events: none;
            display: flex;
            gap: 15px;
        }
        
        .control-btn {
            pointer-events: auto;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: manipulation;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        
        @media (max-width: 768px) {
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- Mobile touch controls (shown only during gameplay on touch devices) -->
    <div class="controls" id="touch-controls">
        <div class="left-controls">
            <div class="control-btn" id="left-btn">←</div>
            <div class="control-btn" id="right-btn">→</div>
        </div>
        <div class="right-controls">
            <div class="control-btn" id="jump-btn">↑</div>
            <div class="control-btn" id="fire-btn">🔥</div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
